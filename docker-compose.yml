services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: agent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    ports:
      - "5433:5432"   # host 5433 to avoid conflict with local PostgreSQL on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-agent:
    build:
      context: ./backend-agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pguser:pgpass@postgres:5432/agent_db
      USER_BACKEND_URL: http://backend-user:8001
      INTERNAL_API_KEY: shared-internal-api-key
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    depends_on:
      postgres:
        condition: service_healthy

  backend-user:
    build:
      context: ./backend-user
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://pguser:pgpass@postgres:5432/user_db
      AGENT_BACKEND_URL: http://backend-agent:8000
      INTERNAL_API_KEY: shared-internal-api-key
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
